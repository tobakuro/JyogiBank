name: 機能要望
description: 新機能や改善案を提案する
labels: ["enhancement"]
body:
  - type: dropdown
    id: scope
    attributes:
      label: 対象
      options:
        - bot
        - web
        - 両方
        - その他
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 要望の概要
      description: 何をしたいか・何が嬉しいかを簡潔に説明してください
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 背景・モチベーション
      description: なぜこの機能が必要か、現状の課題は何か
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 実装案（任意）
      description: 具体的な実装イメージや参考情報があれば

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案（任意）
