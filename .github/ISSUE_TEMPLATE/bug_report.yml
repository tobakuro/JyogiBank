name: バグ報告
description: 不具合・予期しない動作を報告する
labels: ["bug"]
body:
  - type: dropdown
    id: scope
    attributes:
      label: 対象
      options:
        - bot
        - web
        - 両方
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 不具合の内容
      description: 何が起きているか簡潔に説明してください
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: ログ・エラーメッセージ
      description: 関連するログがあれば貼り付けてください（機密情報は含めないこと）
      render: text
